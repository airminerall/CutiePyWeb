<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | CutiePy</title>
    <link rel="stylesheet" href="css/auth-page.css?v=20260904-3">
    <link rel="stylesheet" href="css/style.css?v=20260910-1">
</head>
<body>
    <main class="auth-page">
        <img class="auth-mascot auth-mascot--bear" src="assets/chikawa.png" alt="" aria-hidden="true">
        <img class="auth-mascot auth-mascot--cat" src="assets/chikawa_folder_icon_2-removebg-preview.png" alt="" aria-hidden="true">
        <img class="auth-mascot auth-mascot--rabbit" src="assets/chikawa_folder_icon_3-removebg-preview.png" alt="" aria-hidden="true">
        <a class="auth-brand" href="index.html" aria-label="Back to CutiePy home">cutie py.</a>

        <section class="auth-panel auth-choice" aria-labelledby="choice-title">

            <div class="auth-logo" aria-hidden="true"></div>

            <div class="auth-panel-heading">
                <p class="auth-kicker">Welcome to CutiePy</p>
                <h1 id="choice-title">Start learning Python.</h1>
                <p class="auth-subtitle">Sign in or create an account to enter your workspace.</p>
            </div>

            <div class="auth-choice-actions">
                <a class="auth-choice-button auth-choice-primary"   href="auth-form.html?mode=login">Sign In</a>
                <a class="auth-choice-button auth-choice-secondary" href="auth-form.html?mode=signup">Create Account</a>
            </div>

            <p class="auth-footer">Your playful place to learn Python.</p>
        </section>
    </main>
    <script src="js/loader.js"></script>
    <script src="js/page-progress.js"></script>
    <script src="js/gemini-config.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
